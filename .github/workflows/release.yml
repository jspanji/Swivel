name: Release

# Triggered by pushing a `vX.Y.Z` tag (or manual dispatch). Builds the app,
# signs it for Sparkle, publishes the signed <item> to appcast.xml, and creates
# a DRAFT GitHub Release with the zip attached for the maintainer to publish.
#
# Requires the `SPARKLE_ED_PRIVATE_KEY` secret: export your key with
#   .build/artifacts/sparkle/Sparkle/bin/generate_keys -x key.txt
# and paste the file's contents into the repo secret.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.1)"
        required: true
        type: string

permissions:
  contents: write   # create the release + commit the appcast update

jobs:
  release:
    name: Build, sign + draft release
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check out the branch (not the detached tag) so the appcast commit
          # can be pushed back, and fetch ALL history so build-app.sh's
          # rev-count build number is monotonic — a shallow clone yields 1,
          # which would make every release look like the same version.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      # Developer ID signing + notarization. All five secrets must be present;
      # if any is missing we skip this step entirely and build-app.sh falls
      # back to ad-hoc signing, so forks and secret-less runs still work.
      #
      # One-time setup (see docs/ARCHITECTURE.md → "Release process"):
      #   Keychain Access → export "Developer ID Application: …" as a .p12
      #   base64 -i cert.p12 | pbcopy      → secret BUILD_CERTIFICATE_BASE64
      #   the .p12 export password         → secret P12_PASSWORD
      #   any random string                → secret KEYCHAIN_PASSWORD
      #   Apple ID email / team id / app-specific password
      #                                    → APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD
      - name: Import Developer ID certificate
        id: signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "${BUILD_CERTIFICATE_BASE64:-}" ] || [ -z "${APPLE_ID:-}" ]; then
            echo "::warning::Signing secrets absent — this release will be AD-HOC signed, not notarized."
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          # Dedicated ephemeral keychain — never touch the runner's default.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # Without this, codesign blocks on an interactive keychain prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          # Keep the runner's existing keychains in the search list rather than
          # replacing it. Replacing can hide Apple's intermediate CAs, and
          # without the "Developer ID Certification Authority" chain the
          # identity evaluates as CSSMERR_TP_NOT_TRUSTED — `find-identity -v`
          # then reports 0 valid identities and build-app.sh would silently
          # fall back to AD-HOC signing. (This exact failure happened during
          # local setup.)
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

          # Belt-and-braces: install the Developer ID G2 intermediate itself.
          if curl -fsSL --retry 3 \
               https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
               -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"; then
            security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
              -k "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
          fi
          rm -f "$CERT_PATH"

          # Fail loudly instead of shipping an unnotarized build by accident:
          # if the signing secrets were supplied, a VALID identity must exist.
          if ! security find-identity -v -p codesigning | grep -q "Developer ID Application"; then
            echo "::error::Certificate imported but no VALID Developer ID identity is visible."
            echo "Identities present (may be untrusted / missing chain):"
            security find-identity -p codesigning || true
            exit 1
          fi
          security find-identity -v -p codesigning

          # Notary credentials into the same ephemeral keychain.
          xcrun notarytool store-credentials "swivel-notary" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

          echo "notarized=true" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"

      - name: Derive version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
          else
            RAW_TAG="${{ github.ref_name }}"
          fi
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build release artifact
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.version }}
          # Empty when secrets are absent → build-app.sh skips notarization.
          NOTARY_PROFILE: ${{ steps.signing.outputs.notarized == 'true' && 'swivel-notary' || '' }}
          # The profile lives in the ephemeral keychain, not the default one,
          # so notarytool needs to be told where to look.
          NOTARY_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: ./build-app.sh --release

      - name: Locate artifact + build number
        id: artifact
        run: |
          ZIP="build/Swivel-${{ steps.version.outputs.version }}.zip"
          if [ ! -f "$ZIP" ]; then echo "::error::$ZIP not found"; exit 1; fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$ZIP" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          DMG="build/Swivel-${{ steps.version.outputs.version }}.dmg"
          if [ -f "$DMG" ]; then
            echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
            echo "dmg_sha256=$(shasum -a 256 "$DMG" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          fi
          echo "build_number=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' build/Swivel.app/Contents/Info.plist)" >> "$GITHUB_OUTPUT"

      - name: Sign update (Sparkle EdDSA)
        id: sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY secret is not set — cannot sign the update."
            exit 1
          fi
          # The EdDSA signing binary. Pin the canonical SPM artifact path: a
          # loose find also matches the legacy old_dsa_scripts/sign_update (and
          # the Sparkle source checkout), and picking the wrong one fails on
          # --ed-key-file. Fall back to a precise find (artifacts only, direct
          # bin/ child) if the layout ever moves.
          SIGN=".build/artifacts/sparkle/Sparkle/bin/sign_update"
          if [ ! -x "$SIGN" ]; then
            SIGN="$(find .build/artifacts -type f -name sign_update -path '*/bin/sign_update' | head -1)"
          fi
          if [ -z "$SIGN" ] || [ ! -x "$SIGN" ]; then
            echo "::error::EdDSA sign_update binary not found under .build/artifacts"; exit 1
          fi
          echo "key: ${#SPARKLE_PRIVATE_KEY} chars (a Sparkle EdDSA private key is 44); signer: $SIGN"
          KEYFILE="$(mktemp)"
          trap 'rm -f "$KEYFILE"' EXIT
          # Strip any stray whitespace/newlines a paste may have introduced.
          printf '%s' "$SPARKLE_PRIVATE_KEY" | tr -d '[:space:]' > "$KEYFILE"
          echo "key file: $(wc -c < "$KEYFILE") bytes"
          # Capture sign_update's own error instead of letting `set -e` swallow it.
          set +e
          SIGOUT="$("$SIGN" "${{ steps.artifact.outputs.zip }}" --ed-key-file "$KEYFILE" 2>&1)"
          RC=$?
          set -e
          echo "sign_update (rc=$RC): $SIGOUT"
          if [ "$RC" -ne 0 ]; then
            echo "::error::sign_update failed (rc=$RC): $SIGOUT"; exit 1
          fi
          ED_SIG="$(printf '%s' "$SIGOUT" | sed -n 's/.*edSignature="\([^"]*\)".*/\1/p')"
          LENGTH="$(printf '%s' "$SIGOUT" | sed -n 's/.*length="\([0-9]*\)".*/\1/p')"
          if [ -z "$ED_SIG" ] || [ -z "$LENGTH" ]; then
            echo "::error::Could not parse signature/length from sign_update output."
            exit 1
          fi
          echo "ed_sig=$ED_SIG" >> "$GITHUB_OUTPUT"
          echo "length=$LENGTH" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="$(awk -v ver="$VERSION" '
            /^## \[/ { if (capture) exit; if ($0 ~ "\\[" ver "\\]") { capture=1; next } }
            capture { print }
          ' CHANGELOG.md)"
          [ -z "$NOTES" ] && NOTES="See CHANGELOG.md for details."
          # Clean copy for the Sparkle <description> — no SHA/signing footer.
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/appcast-notes.md"
          {
            echo "notes<<NOTES_EOF"
            echo "$NOTES"
            echo ""
            echo "---"
            echo ""
            echo "**SHA-256 (Swivel-$VERSION.zip):** \`${{ steps.artifact.outputs.sha256 }}\`"
            if [ -n "${{ steps.artifact.outputs.dmg_sha256 }}" ]; then
              echo ""
              echo "**SHA-256 (Swivel-$VERSION.dmg):** \`${{ steps.artifact.outputs.dmg_sha256 }}\`"
            fi
            echo ""
            if [ "${{ steps.signing.outputs.notarized }}" = "true" ]; then
              echo "> ✅ Signed with a Developer ID and notarized by Apple — no Gatekeeper warning."
            else
              echo "> ⚠️ Ad-hoc signed. On first launch, right-click the app and choose **Open** to bypass Gatekeeper."
            fi
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Swivel ${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          draft: true
          prerelease: false
          files: |
            ${{ steps.artifact.outputs.zip }}
            ${{ steps.artifact.outputs.dmg }}

      - name: Next step
        run: |
          {
            echo "### Draft release created — publish it to finish"
            echo ""
            echo "The Sparkle appcast is **not** updated yet, by design: the feed"
            echo "must never advertise a download before the release is published,"
            echo "or Sparkle offers an update whose URL 404s."
            echo ""
            echo "Publishing the draft triggers \`publish-appcast.yml\`, which"
            echo "signs the released zip and commits the feed entry."
          } >> "$GITHUB_STEP_SUMMARY"
