name: CI

# Build on every push to main and on every PR. Keeps the default branch
# green and catches regressions before they land.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel superseded runs on the same ref — saves runner minutes on
# force-pushes and PR refreshes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (macOS 14 / Swift)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        # swift-testing (the `Testing` module the suite uses) ships with
        # Xcode 16+. Pick the newest installed Xcode 16 so `swift test` can
        # build the tests; fall back to the runner's default Xcode.
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}"

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build (debug)
        run: swift build

      - name: Test
        run: swift test

      - name: Build (release)
        run: swift build -c release

      - name: Assemble .app bundle
        # Proves the bundle script still works end-to-end. No install,
        # no signing beyond ad-hoc.
        run: ./build-app.sh

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swivel.app-${{ github.sha }}
          path: build/Swivel.app
          retention-days: 7
